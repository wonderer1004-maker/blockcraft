<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>BlockCraft</title><meta name='theme-color' content='#87ceeb'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='mobile-web-app-capable' content='yes'><style>html,body{margin:0;overflow:hidden;background:#87ceeb;font-family:sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;color:white;text-shadow:0 0 3px #000}.bar{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}.slot{width:45px;height:45px;border:3px solid #777;background:#333c;color:#fff;display:grid;place-items:center;font-size:11px}.slot.sel{border-color:#fff}.help{position:absolute;top:10px;left:10px;background:#0008;color:#fff;padding:8px;border-radius:8px;font-size:12px}.joy{display:none;position:absolute;bottom:85px;width:120px;height:120px;border-radius:50%;background:#ffffff25;border:2px solid #fff6;pointer-events:auto}.joy.left{left:20px}.joy.right{right:20px}.btn{display:none;position:absolute;right:25px;bottom:220px;width:62px;height:62px;border-radius:50%;background:#ffffff55;color:#fff;place-items:center;pointer-events:auto;font-weight:bold}.mine{bottom:295px}.jump{right:105px;bottom:220px}.save{position:absolute;right:10px;top:10px;pointer-events:auto;background:#222b;color:#fff;border:1px solid #fff5;padding:8px;border-radius:7px}@media(max-width:800px){.joy,.btn{display:grid}.help{font-size:10px}} .stats{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#0008;color:white;padding:7px 12px;border-radius:10px;font-weight:bold}.hp{color:#ff7373}.food{color:#ffd66b}.count{font-size:10px;background:#0009;padding:1px 3px;border-radius:3px}@media(max-width:800px){.stats{top:8px;font-size:12px}.help{display:none}.bar{gap:2px;max-width:94vw;overflow-x:auto}.slot{width:38px;height:38px;font-size:9px;flex:0 0 auto}} </style></head><body><div class='hud'><div class='cross'>+</div><div class='stats'><span class='hp' id='hp'>❤ 10</span> · <span class='food' id='food'>● 10</span> · <span id='clock'>☀ 낮</span></div><div class='help'>PC: WASD 이동 · Space 점프 · 마우스 시점 · 좌클릭 파괴 · 우클릭 설치<br>모바일: 왼쪽 이동 · 오른쪽 시점 · 점프/설치/파괴</div><button class='save' id='save'>저장</button><div class='joy left' id='jl'></div><div class='joy right' id='jr'></div><div class='btn mine' id='mine'>파괴</div><div class='btn jump' id='jump'>점프</div><div class='btn' id='place'>설치</div><div class='bar' id='bar'></div></div><script type='module'>
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,20,55);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);camera.position.set(0,7,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x665544,2.2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,20,5);scene.add(sun);
const colors={grass:0x55aa44,dirt:0x8a5a32,stone:0x888888,wood:0x8b653f,leaf:0x3f8f3f,sand:0xd8c47a,coal:0x333333,iron:0xb68f76,gold:0xe8c547,crystal:0x42d9e8};let selected='grass';const types=Object.keys(colors);const blocks=new Map();const geo=new THREE.BoxGeometry(1,1,1);const key=(x,y,z)=>`${x},${y},${z}`;
function add(x,y,z,t='grass',save=true){if(blocks.has(key(x,y,z)))return;const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:colors[t]}));m.position.set(x,y,z);m.userData={x,y,z,t};scene.add(m);blocks.set(key(x,y,z),m);if(save)scheduleSave()}
function del(m){scene.remove(m);blocks.delete(key(m.userData.x,m.userData.y,m.userData.z));scheduleSave()}
function terrain(){for(let x=-12;x<=12;x++)for(let z=-12;z<=12;z++){const h=Math.floor(2+Math.sin(x*.35)+Math.cos(z*.3));for(let y=-2;y<=h;y++)add(x,y,z,y===h?'grass':y>h-2?'dirt':(y<1&&Math.random()<.035?'coal':y<0&&Math.random()<.018?'iron':y<0&&Math.random()<.008?'gold':y<-1&&Math.random()<.004?'crystal':'stone'),false)}for(const [x,z] of [[-5,-3],[5,2],[2,-6]]){let y=10;for(let yy=8;yy>=-2;yy--)if(blocks.has(key(x,yy,z))){y=yy+1;break}for(let i=0;i<3;i++)add(x,y+i,z,'wood',false);for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)add(x+dx,y+3,z+dz,'leaf',false);add(x,y+4,z,'leaf',false)}}
const saved=localStorage.getItem('blockcraft-world');if(saved){JSON.parse(saved).forEach(b=>add(b.x,b.y,b.z,b.t,false))}else terrain();
let inventory={};types.forEach(t=>inventory[t]=12);let health=10,hunger=10,dayTime=.22;let st;function scheduleSave(){clearTimeout(st);st=setTimeout(save,300)}function save(){localStorage.setItem('blockcraft-world',JSON.stringify([...blocks.values()].map(m=>m.userData)));localStorage.setItem('blockcraft-player',JSON.stringify({inventory,health,hunger,dayTime}))}document.getElementById('save').onclick=save;try{const p=JSON.parse(localStorage.getItem('blockcraft-player'));if(p){inventory={...inventory,...p.inventory};health=p.health??10;hunger=p.hunger??10;dayTime=p.dayTime??.22}}catch(e){}
const bar=document.getElementById('bar');types.forEach((t,i)=>{const e=document.createElement('div');e.className='slot'+(i===0?' sel':'');e.innerHTML=`<span>${t}</span><span class='count' id='n-${t}'>${inventory[t]||0}</span>`;e.style.background='#'+colors[t].toString(16).padStart(6,'0');e.onclick=()=>{selected=t;[...bar.children].forEach(x=>x.classList.remove('sel'));e.classList.add('sel')};bar.append(e)});
let yaw=0,pitch=-.25,vy=0,onGround=false,jumpQueued=false;const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit'))bar.children[+e.code.at(-1)-1]?.click()});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('click',()=>{if(innerWidth>800)renderer.domElement.requestPointerLock()});addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-1.45,Math.min(1.45,pitch-e.movementY*.0025))}});addEventListener('contextmenu',e=>e.preventDefault());
const ray=new THREE.Raycaster();function refresh(){types.forEach(t=>{const n=document.getElementById('n-'+t);if(n)n.textContent=inventory[t]||0});document.getElementById('hp').textContent='❤ '+Math.ceil(health);document.getElementById('food').textContent='● '+Math.ceil(hunger)}refresh();function action(place){ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects([...blocks.values()],false);if(!hits.length||hits[0].distance>7)return;const h=hits[0];if(place){if((inventory[selected]||0)<=0)return;const p=h.object.position.clone().add(h.face.normal);add(Math.round(p.x),Math.round(p.y),Math.round(p.z),selected);inventory[selected]--;refresh()}else if(h.object.position.y>-2){inventory[h.object.userData.t]=(inventory[h.object.userData.t]||0)+1;del(h.object);refresh()}}renderer.domElement.addEventListener('mousedown',e=>action(e.button===2));document.getElementById('mine').onclick=()=>action(false);document.getElementById('place').onclick=()=>action(true);document.getElementById('jump').onclick=()=>jumpQueued=true;
let moveX=0,moveZ=0;function joy(el,cb){let id=null,sx=0,sy=0;el.addEventListener('pointerdown',e=>{id=e.pointerId;sx=e.clientX;sy=e.clientY;el.setPointerCapture(id)});el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;cb((e.clientX-sx)/45,(e.clientY-sy)/45)});el.addEventListener('pointerup',e=>{id=null;cb(0,0)})}joy(document.getElementById('jl'),(x,y)=>{moveX=Math.max(-1,Math.min(1,x));moveZ=Math.max(-1,Math.min(1,y))});joy(document.getElementById('jr'),(x,y)=>{yaw-=x*.035;pitch=Math.max(-1.45,Math.min(1.45,pitch-y*.035))});
function groundY(x,z){let best=-2;for(const m of blocks.values())if(Math.abs(m.position.x-x)<.45&&Math.abs(m.position.z-z)<.45&&m.position.y<=camera.position.y-1)best=Math.max(best,m.position.y);return best+.5}
let last=performance.now(),survivalTick=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;dayTime=(dayTime+dt/180)%1;const ang=dayTime*Math.PI*2;sun.position.set(Math.cos(ang)*20,Math.sin(ang)*25,8);const daylight=Math.max(.08,Math.sin(ang)*.8+.25);sun.intensity=daylight*2.2;const sky=new THREE.Color().setHSL(.56,.55,Math.max(.04,.18+daylight*.48));scene.background=sky;scene.fog.color.copy(sky);document.getElementById('clock').textContent=daylight>.35?'☀ 낮':'☾ 밤';survivalTick+=dt;if(survivalTick>18){survivalTick=0;hunger=Math.max(0,hunger-.25);if(hunger<=0)health=Math.max(1,health-.5);refresh();scheduleSave()}camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-moveZ,r=(keys.KeyD?1:0)-(keys.KeyA?1:0)+moveX;const len=Math.hypot(f,r)||1;f/=len;r/=len;const speed=5;camera.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*r)*speed*dt;camera.position.z+=(-Math.cos(yaw)*f+Math.sin(yaw)*r)*speed*dt;const gy=groundY(camera.position.x,camera.position.z)+1.65;if(camera.position.y<=gy+.05){camera.position.y=gy;vy=0;onGround=true}else{vy-=18*dt;camera.position.y+=vy*dt;onGround=false}if((keys.Space||jumpQueued)&&onGround){vy=7;camera.position.y+=.05;jumpQueued=false}else if(jumpQueued&&!onGround){jumpQueued=false}renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
