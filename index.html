 이동 · Space 점프 · 마우스 시점 · 좌클릭 파괴 · 우클릭 설치<br>모바일: 왼쪽 이동 · 화면 드래그로 시점 회전 · 점프/설치/파괴</div><button class='save' id='save'>저장</button><button class='fullscreen' id='fullscreen'>⛶ 전체화면</button><div class='joy left' id='jl'></div><div class='btn mine' id='mine'>파괴</div><div class='btn jump' id='jump'>점프</div><div class='btn' id='place'>설치</div><div class='bar' id='bar'></div></div><script type='module'>

const saved=localStorage.getItem('blockcraft-world');if(saved){JSON.parse(saved).forEach(b=>add(b.x,b.y,b.z,b.t,false))}else terrain();
let inventory={};types.forEach(t=>inventory[t]=12);let health=10,hunger=10,dayTime=.22;let st;function scheduleSave(){clearTimeout(st);st=setTimeout(save,300)}function save(){localStorage.setItem('blockcraft-world',JSON.stringify([...blocks.values()].map(m=>m.userData)));localStorage.setItem('blockcraft-player',JSON.stringify({inventory,health,hunger,dayTime}))}document.getElementById('save').onclick=save;

document.addEventListener('fullscreenchange',()=>{fsBtn.textContent=document.fullscreenElement?'⛶ 종료':'⛶ 전체화면';resizeGame()});try{const p=JSON.parse(localStorage.getItem('blockcraft-player'));if(p){inventory={...inventory,...p.inventory};health=p.health??10;hunger=p.hunger??10;dayTime=p.dayTime??.22}}catch(e){}
const bar=document.getElementById('bar');types.forEach((t,i)=>{const e=document.createElement('div');e.className='slot'+(i===0?' sel':'');e.innerHTML=`<span>${t}</span><span class='count' id='n-${t}'>${inventory[t]||0}</span>`;e.style.background='#'+colors[t].toString(16).padStart(6,'0');e.onclick=()=>{selected=t;[...bar.children].forEach(x=>x.classList.remove('sel'));e.classList.add('sel')};bar.append(e)});
let yaw=0,pitch=-.25,vy=0,onGround=false,jumpQueued=false;const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Digit'))bar.children[+e.code.at(-1)-1]?.click()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys.Space=false;jumpQueued=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.Space=false;jumpQueued=false}});renderer.domElement.addEventListener('click',()=>{if(innerWidth>800)renderer.domElement.requestPointerLock()});addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-1.45,Math.min(1.45,pitch-e.movementY*.0025))}});addEventListener('contextmenu',e=>e.preventDefault());
const ray=new THREE.Raycaster();function refresh(){types.forEach(t=>{const n=document.getElementById('n-'+t);if(n)n.textContent=inventory[t]||0});document.getElementById('hp').textContent='❤ '+Math.ceil(health);document.getElementById('food').textContent='● '+Math.ceil(hunger)}refresh();function action(place){ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects([...blocks.values()],false);if(!hits.length||hits[0].distance>7)return;const h=hits[0];if(place){if((inventory[selected]||0)<=0)return;const p=h.object.position.clone().add(h.face.normal);const bx=Math.round(p.x),by=Math.round(p.y),bz=Math.round(p.z);if(Math.abs(bx-camera.position.x)<.7&&Math.abs(bz-camera.position.z)<.7&&Math.abs(by-(camera.position.y-1))<1.8)return;add(bx,by,bz,selected);inventory[selected]--;refresh()}else if(h.object.position.y>-2){inventory[h.object.userData.t]=(inventory[h.object.userData.t]||0)+1;del(h.object);refresh()}}const finePointer=matchMedia('(pointer:fine)').matches;
renderer.domElement.addEventListener('mousedown',e=>{
  if(!finePointer)return;

});const mineBtn=document.getElementById('mine'),placeBtn=document.getElementById('place'),jumpBtn=document.getElementById('jump');

let moveX=0,moveZ=0;
let lookId=null,lastLookX=0,lastLookY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'){
    lookId=e.pointerId; lastLookX=e.clientX; lastLookY=e.clientY;

function joy(el,cb){let id=null,sx=0,sy=0;el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();id=e.pointerId;sx=e.clientX;sy=e.clientY;el.setPointerCapture(id)});el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;e.preventDefault();e.stopPropagation();cb((e.clientX-sx)/45,(e.clientY-sy)/45)});el.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();id=null;cb(0,0)})}joy(document.getElementById('jl'),(x,y)=>{moveX=Math.max(-1,Math.min(1,x));moveZ=Math.max(-1,Math.min(1,y))});
function groundY(x,z){
  const footY=camera.position.y-1.65;
  let best=-Infinity;
  const radius=.28;
  for(const m of blocks.values()){
    const top=m.position.y+.5;
    // Only support blocks whose top is at/below the player's feet (+ tiny tolerance).
    if(top>footY+.12)continue;
    if(Math.abs(m.position.x-x)<=.5+radius&&Math.abs(m.position.z-z)<=.5+radius){
      best=Math.max(best,m.position.y);
    }
  }
  return Number.isFinite(best)?best+.5:null
}

  const r=.31;

  }

  for(let s=0;s<steps;s++){
    const sx=dx/steps,sz=dz/steps;
    if(!bodyBlocked(camera.position.x+sx,camera.position.z))camera.position.x+=sx;

let last=performance.now(),survivalTick=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;dayTime=(dayTime+dt/180)%1;const ang=dayTime*Math.PI*2;sun.position.set(Math.cos(ang)*20,Math.sin(ang)*25,8);const sunHeight=Math.sin(ang);const daylight=THREE.MathUtils.clamp((sunHeight+.18)/.72,0,1);sun.intensity=.03+daylight*2.35;hemi.intensity=.12+daylight*2.05;moon.intensity=(1-daylight)*.32;moon.position.set(-Math.cos(ang)*20,-Math.sin(ang)*25,-8);const night=new THREE.Color(0x071126),dawn=new THREE.Color(0x9b6570),day=new THREE.Color(0x78bfea);let sky=night.clone().lerp(dawn,Math.min(1,daylight*2));if(daylight>.5)sky.lerp(day,(daylight-.5)*2);scene.background.copy(sky);scene.fog.color.copy(sky);renderer.toneMappingExposure=.45+daylight*.75;document.getElementById('clock').textContent=daylight>.55?'☀ 낮':daylight>.15?'◐ 황혼':'☾ 밤';survivalTick+=dt;if(survivalTick>18){survivalTick=0;hunger=Math.max(0,hunger-.25);if(hunger<=0)health=Math.max(1,health-.5);refresh();scheduleSave()}camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-moveZ,r=(keys.KeyD?1:0)-(keys.KeyA?1:0)+moveX;const len=Math.hypot(f,r)||1;f/=len;r/=len;const speed=5;const forwardX=-Math.sin(yaw),forwardZ=-Math.cos(yaw),rightX=Math.cos(yaw),rightZ=-Math.sin(yaw);const dx=(forwardX*f+rightX*r)*speed*dt,dz=(forwardZ*f+rightZ*r)*speed*dt;
moveHorizontal(dx,dz)
